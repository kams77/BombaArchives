<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bomba Archives : démonstration d'une plateforme de gestion électronique de documents et d'archivage numérique pour Kinshasa.">
<style>
/* Base équivalente à l'enveloppe des artefacts */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Bomba Archives</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: sidebar with two workspaces (client / prestataire) + work area; archive "cotes" set in mono with a stamp hue */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E8ECEA; --ink:#14201E; --muted:#5B6A67; --line:#D3DBD8;
  --accent:#0D6B5B; --accent-soft:#DCEFEA; --on-accent:#FFFFFF;
  --stamp:#9C6A1A; --stamp-soft:#F6EAD3;
  --ok:#2E7D4F; --ok-soft:#E1F1E7; --warn:#99590A; --warn-soft:#FBEBD2; --danger:#B3261E; --danger-soft:#FADBD8;
  --paper:#FFFEFA; --paper-ink:#1E2524; --scrim:rgba(10,16,15,.40);
  --shadow:0 1px 2px rgba(20,32,30,.06),0 8px 24px rgba(20,32,30,.08);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --c1:#2F7DD1; --c2:#D14B2F; --c3:#7C4DDB; --c4:#14946A; --c5:#C93D84; --c6:#B07A0C;
  --qr-bg:#FFFFFF; --qr-ink:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1413; --surface:#151E1C; --surface-2:#1E2927; --ink:#E4EBE9; --muted:#98A8A4; --line:#2B3836;
    --accent:#4CC0A8; --accent-soft:#16332D; --on-accent:#05211B;
    --stamp:#E0B266; --stamp-soft:#33291A;
    --ok:#6FCB92; --ok-soft:#173225; --warn:#F0B35A; --warn-soft:#352812; --danger:#F28B82; --danger-soft:#3A1C1A;
    --paper:#1A2321; --paper-ink:#DDE5E2; --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#151E1C; --surface-2:#1E2927; --ink:#E4EBE9; --muted:#98A8A4; --line:#2B3836;
  --accent:#4CC0A8; --accent-soft:#16332D; --on-accent:#05211B;
  --stamp:#E0B266; --stamp-soft:#33291A;
  --ok:#6FCB92; --ok-soft:#173225; --warn:#F0B35A; --warn-soft:#352812; --danger:#F28B82; --danger-soft:#3A1C1A;
  --paper:#1A2321; --paper-ink:#DDE5E2; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;gap:18px;background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.brand b{font-family:var(--f-head);font-size:17px;font-weight:600;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:11.5px;display:block}
.modes{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.modes a{text-align:center;padding:6px 6px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:12.5px}
.modes a[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg,.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--stamp);color:var(--surface);font-size:11px;border-radius:999px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--muted)}
.side-foot p{margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit;text-align:left}

main{min-width:0;padding-block:22px 56px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-size:24px;font-weight:600}
.topbar .sub{color:var(--muted);margin-top:2px}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.who label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex:1 1 200px;min-width:0}
.who select{text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);width:100%}
.who .as{font-size:13px;color:var(--muted);padding-bottom:9px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.bell:hover{background:var(--surface-2)}
.bell .dot{position:absolute;top:-6px;right:-6px;background:var(--danger);color:var(--surface);font-size:11px;font-weight:600;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.notif{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.notif .li{align-items:center}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;max-width:100%}
textarea{resize:vertical;line-height:1.5;width:100%}

.notice{display:flex;gap:10px;align-items:flex-start;background:var(--stamp-soft);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.notice svg{flex:none;width:16px;height:16px;margin-top:2px;fill:none;stroke:var(--stamp);stroke-width:2;stroke-linecap:round}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-head);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted)}
.stat.alert .v{color:var(--danger)}
.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1440px){.stats.six{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:600px){.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 a{font-family:var(--f-body);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.mt{margin-top:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.panel .li:first-child{padding-top:0}
.li > div{min-width:0}
.li .mono{color:var(--stamp)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.plain{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;color:var(--ink)}
.plain:hover{color:var(--accent)}

.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:6px}
.steps i{height:6px;border-radius:3px;background:var(--surface-2)}
.steps i.done{background:var(--accent)}
.steps i.now{background:var(--stamp)}
.scroll-x{overflow-x:auto}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:4px;min-width:600px}
.stepper div{font-size:11.5px;color:var(--muted);padding-top:7px;border-top:4px solid var(--surface-2)}
.stepper div.done{border-color:var(--accent);color:var(--ink)}
.stepper div.now{border-color:var(--stamp);color:var(--ink);font-weight:600}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.conf,.chip.over{background:var(--danger-soft);color:var(--danger)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.stamp{background:var(--stamp-soft);color:var(--stamp)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.gauge{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.gauge div{height:100%;background:var(--accent)}

.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-position:0 0}
.col{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.col i{display:block;width:min(18px,42%);border-radius:3px 3px 0 0;min-height:2px}
.col i.f{background:var(--stamp)}
.col i.e{background:var(--accent)}
.chart-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px}
.chart-x b{display:block;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.arch{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
.filters{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:6px 0 2px}
.tree{display:flex;flex-direction:column;gap:1px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.svc:hover{background:var(--surface-2)}
.svc[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.svc.sub{padding-left:26px;font-size:13px}
.svc .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.filters select{width:100%}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 14px}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.searchbar input{border:0;background:transparent;flex:1;padding:11px 0;font-size:15px;outline:none;min-width:0}
.hint{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;color:var(--muted);font-size:12.5px}
.hint button{border:1px dashed var(--line);background:none;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.hint button:hover{border-color:var(--accent);color:var(--accent)}
.count{font-size:12.5px;color:var(--muted);margin:14px 0 8px}
.results{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;min-width:0}
.row .m{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);min-width:0}
.row .m .mono{color:var(--stamp)}
.row .rs{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .snip{grid-column:1 / -1;font-size:13px;color:var(--muted);margin-top:4px}
mark{background:var(--stamp-soft);color:var(--ink);border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--stamp)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
.dr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-head h2{font-size:17px;font-weight:600}
.dr-tools{display:flex;gap:8px;flex:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.dr-body{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:20px;line-height:1;flex:none;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{color:var(--stamp);border-color:var(--stamp)}
.icon-btn[aria-pressed="true"] svg{fill:var(--stamp)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pager .inline{gap:6px}
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:24px 26px 16px;box-shadow:var(--shadow);font-size:calc(14px * var(--z,1))}
.sheet-head{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sheet-head .mono{color:var(--stamp);text-transform:none;letter-spacing:0}
.sheet-title{font-family:var(--f-head);font-size:1.15em;font-weight:600;margin-bottom:8px}
.sheet-text{margin:0;line-height:1.7;max-width:64ch}
.sheet img{display:block;max-width:100%;border:1px solid var(--line);margin-bottom:14px}
.skel{height:.6em;border-radius:4px;background:var(--surface-2);margin:.75em 0}
.sheet-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:18px}
.seal{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:6px 12px;border:2px solid var(--stamp);color:var(--stamp);border-radius:4px;transform:rotate(-2.5deg);font-family:var(--f-mono);font-size:11px}
.seal b{font-size:12.5px;letter-spacing:.2em}
.sheet-foot{font-size:11.5px;color:var(--muted)}
.file-note{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:8px 10px;margin-bottom:14px;color:var(--muted)}
.locked{background:var(--surface);border:1.5px dashed var(--line);border-radius:8px;padding:26px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.locked svg{width:28px;height:28px;color:var(--danger)}
.meta{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.meta dt{color:var(--muted);font-size:12.5px}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meta dd .mono{color:var(--stamp)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:14px;font-weight:600}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkout{display:flex;gap:8px;flex-wrap:wrap}
.linkout input{flex:1 1 220px;font-family:var(--f-mono);font-size:12.5px}
.note{background:var(--stamp-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.note .small{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.ghost-danger{color:var(--danger)}

.form-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label:not(.check){font-size:12.5px;font-weight:500}
.span2{grid-column:1 / -1}
.help{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-weight:500;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;margin-bottom:16px;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop label{cursor:pointer;display:block}
.drop u{color:var(--accent)}
.drop svg{width:26px;height:26px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.form-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.form-foot .mono{color:var(--stamp);font-size:14px}
.aside-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.nowrap{white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .mono{color:var(--stamp)}
td select{padding:5px 8px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lots{display:flex;flex-direction:column;gap:12px}
.lot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lot-head{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;align-items:flex-start}
.lot-head h3{font-size:15px;font-weight:600}
.lot-head .mono{color:var(--stamp);font-size:12.5px}
.lot-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted)}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}

.prog .fill{height:100%;background:var(--accent);border-radius:4px}
.lot-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.lot-actions input{width:110px}
details.panel summary{cursor:pointer;font-weight:600;font-family:var(--f-head)}

.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.role h3{font-size:14px;font-weight:600;margin-bottom:6px}
.role p{margin:0;font-size:13px;color:var(--muted)}
.client-card{display:flex;flex-direction:column;gap:12px}
.client-card h3{font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:12.5px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-size:15px;font-family:var(--f-head);font-weight:600;font-variant-numeric:tabular-nums}

.devis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.sum-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sum-line:first-child{border-top:0}
.sum-line span:first-child{min-width:0}
.sum-line.total{font-family:var(--f-head);font-size:20px;font-weight:600;border-top:2px solid var(--ink)}
.sum-sub{font-size:12px;color:var(--muted);display:block}
.inv-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.inv-head h3{font-size:20px;letter-spacing:.06em}
.sheet table{font-size:.92em}
.sheet th,.sheet td{padding:8px 6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.modal-wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--scrim);padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal h2{font-size:17px}
.modal p{margin:0;color:var(--muted)}

.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .n{font-size:11px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.drawer .dr-head{border-bottom:0;padding-bottom:6px}
.dr-tabs{background:var(--surface);padding:0 20px;border-bottom:1px solid var(--line)}
.sheet{position:relative;overflow:hidden}
.sheet > *:not(.wm){position:relative}
.wm{position:absolute;inset:-40%;pointer-events:none;display:flex;flex-wrap:wrap;gap:44px 64px;align-content:center;justify-content:center;transform:rotate(-28deg);font-family:var(--f-mono);font-size:12px;color:var(--paper-ink);opacity:.08;user-select:none}
.sw{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}

.sw input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.sw input[type=checkbox]:checked::after{transform:translateX(17px);background:var(--on-accent)}
.sw input:disabled,.sw select:disabled{opacity:.5;cursor:not-allowed}
.qr{width:104px;height:104px;flex:none;background:var(--qr-bg);padding:4px;border:1px solid var(--line);border-radius:4px}
.qr rect{fill:var(--qr-ink)}
.cert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px dashed var(--stamp);border-radius:8px;padding:12px 14px}

.vres{border-radius:10px;padding:14px 16px;margin-top:14px;display:flex;flex-direction:column;gap:4px}
.vres.ok{background:var(--ok-soft)}
.vres.ko{background:var(--danger-soft)}
.vres b{font-family:var(--f-head);font-size:17px}
.vres.ok b{color:var(--ok)}
.vres.ko b{color:var(--danger)}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}

.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}

.kcard select{font-size:12.5px;padding:5px 8px;width:100%}
.chart.c14,.chart-x.c14{grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.col i.d{background:var(--danger)}
.score{font-family:var(--f-head);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

.nav-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 4px;font-weight:600}
.nav-h:first-child{padding-top:0}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:38px;flex:1 1 240px;min-width:0}
.gsearch svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.gsearch input{border:0;background:transparent;outline:none;flex:1;min-width:0;padding:0;font-size:13.5px}
.gsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface-2);white-space:nowrap}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.tg i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tg button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.bulk{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.bulk select{padding:5px 8px;font-size:12.5px}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover td{background:var(--surface-2)}
table.dt tbody tr.sel td{background:var(--accent-soft)}
table.dt tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dr-actions{background:var(--surface);padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-actions:empty{display:none}
.lockbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;flex:1 1 100%}
.lockbar span{flex:1 1 200px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .st{display:inline-flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11.5px;background:var(--surface);min-width:0}
.flow .st b{font-size:12.5px;font-weight:600}
.flow .st.done{border-color:var(--ok);background:var(--ok-soft)}
.flow .st.now{border-color:var(--stamp);background:var(--stamp-soft)}
.flow .st.ko{border-color:var(--danger);background:var(--danger-soft)}
.flow .ar{color:var(--muted)}
.sigpad{border:1.5px dashed var(--line);border-radius:8px;background:var(--paper);touch-action:none;width:100%;height:150px;display:block;cursor:crosshair}
.sigs{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sig{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.sig img{height:46px;width:auto;max-width:200px;object-fit:contain;object-position:left}
.sig .typed{font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;font-size:24px;color:var(--paper-ink);line-height:46px}
.cap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.qitem{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.qitem:first-child{border-top:0}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-pressed="true"]{background:var(--accent-soft)}
.ocr{font-family:var(--f-mono);font-size:12.5px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:12px;white-space:pre-wrap;max-height:220px;overflow:auto;line-height:1.6}
.modal.wide{max-width:620px}
.modal.pal{max-width:560px;align-self:start;margin-top:8vh}
.pal input{width:100%;font-size:16px;padding:10px 12px}
.pal-list{display:flex;flex-direction:column;max-height:50vh;overflow:auto}
.pal-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;min-width:0}
.pal-list button > span:first-child{display:inline-flex;gap:8px;align-items:center;min-width:0}
.pal-list button:hover,.pal-list button.on,.pal-list button:focus-visible{background:var(--accent-soft)}
.int{display:flex;flex-direction:column;gap:10px}
.int-h{display:flex;gap:12px;align-items:center}
.int-ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.int-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tour{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 32px));z-index:45;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--stamp);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.tour.left{right:auto;left:max(16px,env(safe-area-inset-left,0px))}
.tour h2{font-size:17px}
.tour p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.tour-dots{display:flex;gap:4px}
.tour-dots i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.tour-dots i.done{background:var(--accent)}
.tour-dots i.on{background:var(--stamp)}
.tour-hl{outline:3px solid var(--stamp);outline-offset:3px;border-radius:10px}
.drawer.tour-hl{outline-offset:-3px;border-radius:0}
.mention{color:var(--accent);font-weight:600}
.recent{display:flex;gap:8px;flex-wrap:wrap}
.recent .btn{white-space:normal;text-align:left;max-width:100%;justify-content:flex-start;font-weight:400}
.side-foot .btn{width:100%}

@media (max-width:900px){

  .nav a{white-space:nowrap;flex:none}
  .side-foot{margin-top:0;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .side-foot .btn{width:auto}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.arch,.form-wrap,.devis,.roles{grid-template-columns:minmax(0,1fr)}
  .filters{position:static}
  .fgrid,.fgrid.three{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:minmax(0,1fr);gap:2px 0}
  .meta dd{margin-bottom:8px}
  .dr-head,.dr-body,.dr-tabs,.dr-actions{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
  .drawer{border-left:0}
  .sheet{padding:18px 16px 14px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .cap{grid-template-columns:minmax(0,1fr)}
  .nav-h{display:none}
}
.menu-btn{display:none}
.side-panel{display:contents}
[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 3px var(--danger-soft)}
.err{color:var(--danger);font-size:12px;font-weight:500}
.toast{display:flex;gap:14px;align-items:center}
.toast[hidden],[hidden]{display:none!important}
.toast-undo{background:none;border:0;color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font-size:inherit}
@media (max-width:900px){
  .brand{width:100%}
  .gsearch kbd{display:none}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
  .menu-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .side-panel{display:none}
  .side.open .side-panel{display:flex;flex-direction:column;gap:12px}
  .side.open .nav{flex-direction:column;overflow:visible;padding-bottom:0}
  .side.open .nav a{white-space:normal}
  .side.open .nav-h{display:block}
  .side.open .side-foot{flex-direction:column;align-items:stretch}
}
@media print{
  .side,.who,#notif-root,.toast,#tour-root,.bulk,.hint,.lot-actions,.dr-tools,.dr-actions,.dr-tabs,.scrim,.searchbar,.toolbar .seg{display:none!important}
  .app{display:block}
  main{padding:0}
  .drawer{position:static;width:auto;box-shadow:none;border:0;padding:0}
  .panel,.stat,.tbl,.lot{break-inside:avoid}
}
</style>
</head>

<div class="app">
  <aside class="side">

</div>
<div id="drawer-root"></div>
<div id="modal-root"></div>

function hl(text, ts){
  text = String(text || "");
  if (!ts.length) return esc(text);
  const n = norm(text);
  if (n.length !== text.length) return esc(text);
  const r = [];
  ts.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) > -1) { r.push([i, i + t.length]); i += t.length; } });
  if (!r.length) return esc(text);
  r.sort((a, b) => a[0] - b[0]);
  const m = [r[0].slice()];
  r.slice(1).forEach(x => { const l = m[m.length-1]; if (x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else m.push(x.slice()); });
  let out = "", p = 0;
  m.forEach(x => { out += esc(text.slice(p, x[0])) + "<mark>" + esc(text.slice(x[0], x[1])) + "</mark>"; p = x[1]; });
  return out + esc(text.slice(p));
}
function snippet(text, ts){
  const n = norm(text); let pos = -1;
  ts.forEach(t => { const i = n.indexOf(t); if (i > -1 && (pos < 0 || i < pos)) pos = i; });
  if (pos < 0) return "";
  const s = Math.max(0, pos - 60), e = Math.min(text.length, pos + 150);
  return (s > 0 ? "…" : "") + hl(text.slice(s, e), ts) + (e < text.length ? "…" : "");
}
function matches(d, ts, readable){
  if (!ts.length) return true;

  if (readable) parts.push(d.texte, (d.tags || []).join(" "), (d.notes || []).map(x => x.txt).join(" "));
  const hay = norm(parts.join(" "));
  return ts.every(t => hay.includes(t));
}

function nextCote(c, svc, date){
  const code = c.services.find(s => s[0] === svc)[1];
  const y = (date || "").slice(0,4) || String(TODAY.getFullYear());
  const pre = c.code + "/" + code + "/" + y + "/";
  const max = S.docs.filter(d => d.cote.startsWith(pre)).reduce((m, d) => Math.max(m, parseInt(d.cote.slice(pre.length), 10) || 0), 0);
  return pre + String(max + 1).padStart(4, "0");
}
function afterAjouter(){
  const f = $("#up-file"); if (!f) return;
  pendingFile = null;
  const drop = $("#drop");
  const pick = file => {
    if (!file) return;
    pendingFile = file;
    $("#file-info").innerHTML = `Fichier choisi : <b>${esc(file.name)}</b> · ${nf(Math.max(1, Math.round(file.size/1024)))} Ko`;
    const t = $("#up-titre"); if (!t.value) t.value = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ");
    if (file.type === "text/plain" || /\.txt$/i.test(file.name)) { const r = new FileReader(); r.onload = () => { $("#up-texte").value = String(r.result).slice(0, 6000); }; r.readAsText(file); }
  };
  f.addEventListener("change", () => pick(f.files[0]));
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
  const upd = () => { $("#cote-prev").textContent = nextCote(client(), $("#up-service").value, $("#up-date").value); };
  $("#up-service").addEventListener("change", upd); $("#up-date").addEventListener("change", upd); upd();

  });
}

function createClient(o){
  let code = norm(o.nom).replace(/[^a-z ]/g, "").split(/\s+/).filter(w => w.length > 2).map(w => w[0]).join("").toUpperCase().slice(0, 3);
  if (code.length < 3) code = (code + norm(o.nom).replace(/[^a-z]/g, "").toUpperCase()).slice(0, 3);
  while (S.clients.some(c => c.code === code)) code = code.slice(0, 2) + String.fromCharCode(65 + Math.floor(Math.random() * 26));
  const id = "c" + Date.now();
  const services = (SECTEURS[o.secteur] || SECTEURS["Entreprise"]).map(x => [x, norm(x).replace(/[^a-z]/g, "").slice(0, 3).toUpperCase()]);
  const c = {id, nom:o.nom, secteur:o.secteur, commune:o.commune || "Kinshasa", code, formule:o.formule || "Standard", contact:o.contact, tel:o.tel || "—", depuis:isoDay(TODAY), archive:isoDay(TODAY), services, secu:defSecu()};
  S.clients.push(c);
  S.users.push({id:"u" + Date.now(), client:id, nom:o.contact, role:"Administrateur", services:[], mfa:true});
  log("Nouveau client", o.nom + " (" + code + ")", id);
  return c;
}

function genMonth(){
  const mk = monthKey(TODAY), label = TODAY.toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
  let n = 0;
  S.clients.forEach(c => {
    if (S.invoices.some(i => i.client === c.id && i.mensuel && i.mois === mk)) return;
    const lignes = [[`Abonnement ${c.formule} – ${label}`, 1, S.formules[c.formule].prix]];
    const g = S.cartons.filter(x => x.client === c.id && (x.statut === "En garde" || x.statut === "En consultation")).length;
    if (g) lignes.push([`Garde de ${g} cartons – ${label}`, g, S.tarifs.garde]);
    S.lots.filter(l => l.client === c.id && l.etape >= 5 && l.scan > l.facture).forEach(l => {
      lignes.push([`Numérisation et indexation – ${l.id}`, l.scan - l.facture, +(S.tarifs.scan + S.tarifs.index).toFixed(2)]);
      l.facture = l.scan;
      if (l.acompte) { lignes.push([`Déduction de l'acompte versé – ${l.id}`, 1, -l.acompte]); l.acompte = 0; }
    });
    const id = "FAC-" + TODAY.getFullYear() + "-" + String(S.invSeq++).padStart(3, "0");
    S.invoices.push({id, client:c.id, date:isoDay(TODAY), ech:isoDay(addDays(TODAY, 15)), lignes, paye:null, mensuel:true, mois:mk});
    n++;
  });
  log("Facturation", pl(n, "facture générée", "factures générées") + " pour " + label, S.cur.client);
  toast(pl(n, "facture générée", "factures générées"));
  render();
}

function calcDevis(){
  if (!$("#dv-out")) return;
  const t = S.tarifs, v = id => parseFloat($(id).value) || 0, ck = id => $(id).checked;
  const pages = Math.max(0, v("#dv-pages")), fk = $("#dv-formule").value, mois = Math.max(0, Math.round(v("#dv-mois"))), ops = Math.max(1, Math.round(v("#dv-ops")));
  let unit = Math.max(0, v("#dv-base")) + (ck("#dv-index") ? t.index : 0) + (ck("#dv-prep") ? t.prep : 0);
  if (ck("#dv-site")) unit *= 1.15;
  const scan = pages * unit, abo = S.formules[fk].prix * mois, cartons = Math.ceil(pages / 2000);
  const garde = ck("#dv-garde") ? cartons * t.garde * mois : 0, fo = ck("#dv-form") ? t.formation : 0, total = scan + abo + garde + fo;
  const jours = Math.ceil(pages / (2000 * ops));
  let h = `<div class="sum-line"><span>Numérisation<span class="sum-sub">${nf(pages)} pages × ${usd(unit)}</span></span><span>${usd(scan)}</span></div>`;
  h += `<div class="sum-line"><span>Abonnement ${esc(fk)}<span class="sum-sub">${S.formules[fk].prix} $ × ${mois} mois</span></span><span>${usd(abo)}</span></div>`;
  if (garde) h += `<div class="sum-line"><span>Garde des originaux<span class="sum-sub">${cartons} cartons × ${usd(t.garde)} × ${mois} mois</span></span><span>${usd(garde)}</span></div>`;
  h += `<div class="sum-line"><span>Formation des utilisateurs</span><span>${usd(fo)}</span></div>`;
  h += `<div class="sum-line total"><span>Total du projet</span><span>${usd(total)}</span></div>`;
  h += `<div class="sum-line"><span>Acompte à la commande<span class="sum-sub">40 % de la numérisation, plus la formation</span></span><span>${usd(scan * 0.4 + fo)}</span></div>`;
  h += `<div class="sum-line"><span>Délai de numérisation</span><span>${pl(jours, "jour ouvrable", "jours ouvrables")}</span></div>`;
  h += `<div class="sum-line"><span>Revenu récurrent après le projet</span><span>${usd(S.formules[fk].prix + (ck("#dv-garde") ? cartons * t.garde : 0))}/mois</span></div>`;
  $("#dv-out").innerHTML = h;
}

  if (hasQR()) { try { const q = window.qrcode(0, "M"); q.addData(code); q.make(); const N = q.getModuleCount(); let r = ""; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (q.isDark(i, j)) r += `<rect x="${j}" y="${i}" width="1.02" height="1.02"/>`; return `<svg class="qr" viewBox="-2 -2 ${N + 4} ${N + 4}" role="img" aria-label="QR code contenant ${esc(code)}" shape-rendering="crispEdges">${r}</svg>`; } catch (err) {} }
  let x = 1; for (const ch of code) x = (x * 31 + ch.charCodeAt(0)) % 2147483647;
  const N = 21; let r = "";
  const fin = (i, j) => (i < 7 && j < 7) || (i < 7 && j >= N - 7) || (i >= N - 7 && j < 7);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    let on;
    if (fin(i, j)) { const a = i >= N - 7 ? i - (N - 7) : i, b = j >= N - 7 ? j - (N - 7) : j; on = a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4); }
    else if ((i === 7 || j === 7 || i === N - 8 || j === N - 8) && (i < 8 || j < 8 || (i > N - 9 && j < 8) || (j > N - 9 && i < 8))) on = false;
    else { x = (x * 48271) % 2147483647; on = x % 3 !== 0 && (x >> 3) % 2 === 0 || x % 5 === 0; }
    if (on) r += `<rect x="${j}" y="${i}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" aria-hidden="true" shape-rendering="crispEdges">${r}</svg>`;
}

/* ================= GED : tâches, parapheur, capture, circuits, corbeille, intégrations ================= */
const tagById = id => S.tags.find(t => t.id === id);
const tagName = id => (tagById(id) || {nom:""}).nom;
const clientTags = cid => S.tags.filter(t => t.client === cid);
const tagChip = (id, rm) => { const t = tagById(id); return t ? `<span class="tg"><i style="background:var(--c${t.c})"></i>${esc(t.nom)}${rm ? `<button type="button" data-act="tag-rm" data-id="${id}" aria-label="Retirer l'étiquette ${esc(t.nom)}">×</button>` : ""}</span>` : ""; };
const tplFor = type => { const k = Object.keys(S.templates).find(x => norm(x) === norm(type)); return k ? S.templates[k] : []; };
const fmtMeta = (f, v) => f[2] === "date" ? fmtDate(v) : f[2] === "money" ? usd(v) : f[2] === "number" ? nf(v) : v;
const statusLabel = d => ({actif:"Publié", en_validation:"En validation", rejete:"Refusé", a_eliminer:"Proposé à l'élimination", corbeille:"Corbeille", elimine:"Éliminé"})[d.statut] || d.statut;
const circuitById = id => S.circuits.find(c => c.id === id);
const quiLabel = q => q === "admin" ? "Administrateur" : q === "gest" ? "Gestionnaire du service" : ((userById(q) || {}).nom || "Utilisateur supprimé");
const flowChip = s => `<span class="chip ${s === "Terminé" ? "ok" : s === "Rejeté" ? "over" : "soon"}">${esc(s)}</span>`;
const integ = c => c.integ || (c.integ = {scanner:true, email:true, whatsapp:false, m365:false, gdrive:false, api:false});

function parseQ(q){
  const out = {terms:[], phrases:[], excl:[], fields:[]};
  const re = /([\p{L}_]+):"([^"]*)"|([\p{L}_]+):(\S+)|"([^"]+)"|(\S+)/gu;
  let m;
  while ((m = re.exec(q || ""))) {
    if (m[1]) out.fields.push([norm(m[1]), m[2]]);
    else if (m[3]) out.fields.push([norm(m[3]), m[4]]);
    else if (m[5]) out.phrases.push(norm(m[5]));
    else { const t = m[6]; if (t.startsWith("-") && t.length > 2) out.excl.push(norm(t.slice(1))); else if (t.length > 1) out.terms.push(norm(t)); }
  }
  return out;
}
function matchQ(d, p, readable){
  const parts = [d.titre, d.cote, d.type, d.service, (d.tagIds || []).map(tagName).join(" ")];
  if (readable) parts.push(d.texte, (d.tags || []).join(" "), (d.notes || []).map(x => x.txt).join(" "), Object.values(d.meta || {}).join(" "));
  const hay = norm(parts.join(" "));
  if (!p.terms.every(t => hay.includes(t)) || !p.phrases.every(t => hay.includes(t)) || p.excl.some(t => hay.includes(t))) return false;
  return p.fields.every(([k, v]) => {
    const nv = norm(v);
    if (k === "type") return norm(d.type).includes(nv);
    if (k === "service") return norm(d.service).includes(nv);
    if (k === "annee" || k === "an") return d.date.startsWith(v);
    if (k === "cote") return norm(d.cote).includes(nv);
    if (k === "tag" || k === "etiquette") return (d.tagIds || []).some(id => norm(tagName(id)).includes(nv));
    if (k === "par") return norm(d.par).includes(nv);
    if (k === "statut") return norm(statusLabel(d)).includes(nv);
    if (!readable) return false;
    const f = tplFor(d.type).find(x => norm(x[0]) === k || norm(x[1]).includes(k));
    return f ? norm((d.meta || {})[f[0]] || "").includes(nv) : false;
  });
}

/* ---- Circuits de validation et parapheur ---- */
function actorMatches(st, u, d){
  if (!st || !d) return false;
  if (st.qui === "admin") return isAdmin(u);
  if (st.qui === "gest") return isAdmin(u) || (u.role === "Gestionnaire" && u.services.includes(d.service));
  return u.id === st.qui;
}
function canAct(f, u){ if (f.statut !== "En cours" || f.client !== u.client) return false; const ci = circuitById(f.circuit); if (!ci) return false; const st = ci.etapes[f.step], d = docById(f.doc); return actorMatches(st, u, d) || !!delegatorFor(st, u, d); }
function circuitFor(cid, type){ const cs = S.circuits.filter(c => c.client === cid); return cs.find(c => !c.defaut && c.types.some(t => norm(t) === norm(type))) || cs.find(c => c.defaut); }
function startFlow(d, u){
  let ci = circuitFor(d.client, d.type);
  if (ci && ci.defaut && isAdmin(u)) ci = null;
  if (!ci) return null;
  const now = new Date().toISOString();
  const f = {id:"WF-" + String(S.wfSeq++).padStart(4, "0"), client:d.client, doc:d.id, circuit:ci.id, step:0, statut:"En cours", t:now, stepAt:now, by:u.nom, hist:[]};
  while (f.step < ci.etapes.length && ci.etapes[f.step].action === "Valider" && actorMatches(ci.etapes[f.step], u, d)) { f.hist.push({step:f.step, by:u.nom, t:now, dec:"Validé", note:"Validé au dépôt par l'auteur"}); f.step++; }
  if (f.step >= ci.etapes.length) return null;
  d.statut = "en_validation"; S.flows.push(f);
  log("Circuit lancé", f.id + " · " + ci.nom + " · " + lab(d), d.client);
  return f;
}
function flowChain(ci, f){
  const cls = i => !f ? "" : (f.statut === "Rejeté" && i === f.step) ? "ko" : (i < f.step || f.statut === "Terminé") ? "done" : (i === f.step && f.statut === "En cours") ? "now" : "";
  return `<div class="flow"><span class="st done"><b>Dépôt</b><span class="muted">${f ? esc(f.by) : "Auteur"}</span></span>${ci.etapes.map((e, i) => `<span class="ar" aria-hidden="true">→</span><span class="st ${cls(i)}"><b>${i + 1}. ${esc(e.action)}</b><span class="muted">${esc(quiLabel(e.qui))}${e.delai ? " · " + e.delai + " j" : ""}</span></span>`).join("")}<span class="ar" aria-hidden="true">→</span><span class="st ${f && f.statut === "Terminé" ? "done" : ""}"><b>Publié</b><span class="muted">archives</span></span></div>`;
}
function myTasks(){
  const c = client(), u = me(), out = [];
  S.flows.filter(f => f.client === c.id && canAct(f, u)).forEach(f => out.push({k:"flow", f}));

function notifs(m){
  const out = [];
  if (m === "client") {
    const u = me(), c = client();
    const pend = S.demandes.filter(d => d.client === c.id && d.statut === "En attente" && canDecide(d, u));
    if (pend.length) out.push({lvl:"soon", tag:"Demandes", txt:pl(pend.length, "demande") + " en attente de votre décision", h:"demandes"});
    const fa = S.flows.filter(f => f.client === c.id && canAct(f, u));
    if (fa.length) out.push({lvl:"soon", tag:"Parapheur", txt:pl(fa.length, "document") + " à valider ou signer", h:"taches"});
    const um = unreadMentions(u);
    if (um.length) out.push({lvl:"acc", tag:"Mentions", txt:pl(um.length, "annotation vous mentionne", "annotations vous mentionnent"), h:"taches"});
    const lf = S.flows.filter(f => f.client === c.id && f.statut === "En cours" && flowDue(f) < new Date());
    if (isAdmin(u) && lf.length) out.push({lvl:"over", tag:"Circuits", txt:pl(lf.length, "circuit") + " en retard sur son délai", h:"circuits"});
    if (canEdit(u)) { const ib = S.inbox.filter(x => x.client === c.id).length; if (ib) out.push({lvl:"acc", tag:"Capture", txt:pl(ib, "document") + " dans la boîte de dépôt", h:"capture"}); }
    const dec = S.demandes.filter(d => d.client === c.id && d.by === u.id && d.statut !== "En attente");
    if (dec.length) out.push({lvl:"acc", tag:"Réponses", txt:pl(dec.length, "de vos demandes a reçu", "de vos demandes ont reçu") + " une réponse", h:"demandes"});
    if (canEdit(u)) {
      const due = S.docs.filter(d => d.client === c.id && d.statut === "actif" && !d.gel && userSvcs(u).includes(d.service) && retention(d).state !== "ok");
      if (due.length) out.push({lvl:due.some(d => retention(d).state === "over") ? "over" : "soon", tag:"Conservation", txt:pl(due.length, "document") + " en fin de conservation", h:"conservation"});
      const cl = S.courriers.filter(m => m.client === c.id && userSvcs(u).includes(m.service) && courLate(m));
      if (cl.length) out.push({lvl:"over", tag:"Courrier", txt:pl(cl.length, "réponse") + " en retard au registre du courrier", h:"courrier"});
      const mine = S.courriers.filter(m => m.client === c.id && m.assigne === u.nom && m.statut === "À traiter");
      if (mine.length) out.push({lvl:"acc", tag:"Courrier", txt:pl(mine.length, "pli") + " vous " + (mine.length > 1 ? "sont confiés" : "est confié"), h:"courrier"});
    }
    if (isAdmin(u)) {
      const un = S.invoices.filter(i => i.client === c.id && !i.paye);
      if (un.length) out.push({lvl:un.some(i => invState(i) === "En retard") ? "over" : "soon", tag:"Factures", txt:pl(un.length, "facture") + " Bomba à régler (" + usd(un.reduce((a, i) => a + invTotal(i), 0)) + ")", h:"tableau"});
    }
  } else {
    const qc = S.lots.filter(l => l.etape === 4);
    if (qc.length) out.push({lvl:"acc", tag:"Qualité", txt:pl(qc.length, "lot") + " en contrôle qualité", h:"lots"});
    const coll = S.lots.filter(l => l.etape === 0);
    if (coll.length) out.push({lvl:"stamp", tag:"Collecte", txt:pl(coll.length, "lot") + " à collecter chez le client", h:"lots"});
    const cons = S.cartons.filter(x => x.statut === "En consultation");
    if (cons.length) out.push({lvl:"soon", tag:"Magasin", txt:pl(cons.length, "carton") + " en consultation chez un client", h:"magasin"});
    const tm = S.missions.filter(m => m.statut !== "Terminée" && m.date <= isoDay(TODAY));
    if (tm.length) out.push({lvl:"acc", tag:"Missions", txt:pl(tm.length, "mission") + " à réaliser aujourd'hui ou en retard", h:"missions"});
    const pr = S.prospects.filter(p => p.next && p.next <= isoDay(TODAY) && p.etape !== "Signé" && p.etape !== "Perdu");
    if (pr.length) out.push({lvl:"soon", tag:"Prospects", txt:pl(pr.length, "prospect") + " à relancer", h:"prospects"});
    const late = S.invoices.filter(i => invState(i) === "En retard");
    if (late.length) out.push({lvl:"over", tag:"Impayés", txt:pl(late.length, "facture") + " en retard de paiement", h:"facturation"});
    const mk = monthKey(TODAY);
    if (!S.clients.every(c => S.invoices.some(i => i.client === c.id && i.mensuel && i.mois === mk))) out.push({lvl:"soon", tag:"Facturation", txt:"Factures de " + TODAY.toLocaleDateString("fr-FR", {month:"long"}) + " à générer", h:"facturation"});
  }
  return out;
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette(); return; }

      const f = Array.from(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(x => x.offsetParent !== null);

  if (e.key === "Enter" && e.target.matches && e.target.matches("tr[data-act=open]")) { e.target.click(); return; }
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "") && mode() === "client" && !UI.sel) {
    e.preventDefault();
    if (currentKey() !== "archives") location.hash = "#archives";

  else if (UI.sel || UI.inv) { UI.sel = null; UI.inv = null; UI.share = null; UI.req = null; renderDrawer(); restoreFocus(); }
